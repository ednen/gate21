# Local stack: PostgreSQL + API with the fake speech/role-play providers.
#   docker compose -f infra/docker-compose.yml up --build
# To use the real providers, copy infra/.env.example to infra/.env and fill it in.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gate21
      POSTGRES_USER: gate21
      POSTGRES_PASSWORD: gate21
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate21 -d gate21"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/gate21
      DATABASE_USER: gate21
      DATABASE_PASSWORD: gate21
    ports:
      - "8080:8080"
      - "8081:8081"

volumes:
  pgdata:
