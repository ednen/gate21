spring:
  application:
    name: gate21
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gate21}
    username: ${DATABASE_USER:gate21}
    password: ${DATABASE_PASSWORD:gate21}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  server:
    # Actuator lives on an internal port that is not exposed through the load balancer.
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

gate21:
  jwt:
    # Base64 or plain text, at least 32 bytes. Always set JWT_SECRET in production.
    secret: ${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-secret}
    issuer: gate21
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  quota:
    speech-per-day: ${QUOTA_SPEECH_PER_DAY:40}
    roleplay-sessions-per-day: ${QUOTA_ROLEPLAY_PER_DAY:3}
  speech:
    # fake = deterministic local scorer (dev/tests), azure = Azure AI Speech
    provider: ${SPEECH_PROVIDER:fake}
    azure:
      key: ${AZURE_SPEECH_KEY:}
      region: ${AZURE_SPEECH_REGION:westeurope}
      language: en-US
      timeout: 6s
  roleplay:
    # fake = keyword matcher (dev/tests), gemini = Gemini API
    provider: ${ROLEPLAY_PROVIDER:fake}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
      base-url: https://generativelanguage.googleapis.com/v1beta
      timeout: 4s
      max-output-tokens: 200
  membership:
    # true only for local development and tests: purchases are granted without a store receipt.
    sandbox-purchases: ${MEMBERSHIP_SANDBOX:false}
    # Display prices until App Store / Google Play products exist (placeholders, not decided).
    journey-price: ${PRICE_JOURNEY:₺449}
    keep-ready-price: ${PRICE_KEEP_READY:₺99 / ay}
