name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - name: Build and test
        run: |
          set -o pipefail
          mvn -B -f backend/pom.xml verify 2>&1 | tee mvn.log
      - name: Report failures as annotations
        if: failure()
        run: python3 .github/scripts/report_failures.py mvn.log backend/target/surefire-reports

  mobile:
    name: Mobile (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Every spoken line has a recorded voice
        run: python3 ../tools/voice/lines.py --check
      - run: npm run typecheck
      - run: npm test
